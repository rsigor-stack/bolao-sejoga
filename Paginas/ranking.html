<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolão Se Joga Copa do Mundo 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/ranking.css">
</head>
<! Monta o cabeçalho da página>
<div id="header-placeholder"></div>
<script src="../js/common/core.js"></script>
<script src="../js/common/config.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/layout.js"></script>
<script>Bolao.layout.montarHeader();</script>
<! Fim do cabeçalho----------->  

<body>

<div class="container">
    <div class="header">
        🏆 Ranking Geral
    </div>

    <div class="table-wrapper">
        <table id="data" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Participante</th>
                    <th>Pontos</th>
                    <th>Placar Exato <br>(15 pt.)</th>
                    <th>Venc + Pl Venc. <br>(8 pt.)</th>
                    <th>Venc + Pl Perd. <br>(6 pt.)</th>
                    <th>Venc <br>(4 pt.)</th>
                    <th>Empate <br>(7 pt.)</th>
                    <th>Alg Pl. <br>(1 pt.)</th>
                    <th>Zerou Tudo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="10" style="text-align: center; padding: 20px;">
                        Carregando dados da planilha...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO DA API E DA ABA DA PLANILHA
// ═══════════════════════════════════════════════════════════════
const ID_PLANILHA = '1Y7PIt5mzexEgMxSFC-HxoXChRfVwMSsNylFlqzxlT5U'; // ID pegado do seu código original
const ABA_RANKING = 'ClassNovo'; // <--- ALTERE AQUI para o nome exato da aba (ex: 'Ranking', 'Classificacao', etc.)

const URL_API = `https://script.google.com/macros/s/AKfycbxiiDpGwGYiEauxy_1e8fH5ysQGi3IJijVZluOZQI_Ftndbyz6htgngfWQFkfeLwL3XWg/exec?planilha=${ID_PLANILHA}&aba=${ABA_RANKING}`;

async function iniciarTabela() {
  let dadosPlanilha = [];

  try {
    const resposta = await fetch(URL_API);
    const json = await resposta.json();
    // Tenta extrair os dados de 'data' ou usa o próprio json caso não haja o subnível 'data'
    dadosPlanilha = json.data || json || [];
  } catch (erro) {
    console.error("Erro ao buscar dados:", erro);
    document.querySelector('#data tbody').innerHTML = `<tr><td colspan="10" style="text-align:center; color:red; padding:20px;">Erro ao carregar os dados. Verifique o nome da aba e o console (F12).</td></tr>`;
    return;
  }

  // Se não vierem dados, mostra mensagem amigável
  if (dadosPlanilha.length === 0) {
      document.querySelector('#data tbody').innerHTML = `<tr><td colspan="10" style="text-align:center; color:orange; padding:20px;">Nenhum dado encontrado na aba "${ABA_RANKING}".</td></tr>`;
      return;
  }

  new DataTable('#data', {
    data: dadosPlanilha,
    
    columns: [
      { data: 'Pos' },
      { data: 'Aposta' },
      { data: 'Ptos' },
      { data: 'Pl_Exato' },
      { data: 'Venc_PlVenc' },
      { data: 'Venc_PlPerd' },
      { data: 'Venc' },
      { data: 'Empate' },
      { data: 'Alg_Pl' },
      { data: 'ZerouTudo' }
    ],
    
    columnDefs: [
      { targets: '_all', className: 'dt-center' },
      { targets: [1], className: 'dt-left' }
    ],
    
    order: [[0, 'asc']],
    pageLength: 50,
    
    language: {
      url: 'https://cdn.datatables.net/plug-ins/2.3.8/i18n/pt-BR.json'
    },
    
    createdRow: function(row, data) {
      const posicao = Number(data.Pos);
      row.classList.remove('top1','top2','top3');
      switch(posicao){
        case 1: row.classList.add('top1'); break;
        case 2: row.classList.add('top2'); break;
        case 3: row.classList.add('top3'); break;
      }
    }
  });
}

iniciarTabela();
</script>

</body>
</html>
