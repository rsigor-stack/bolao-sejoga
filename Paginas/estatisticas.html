<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolão Se Joga Copa do Mundo 2026 — Estatísticas dos Palpites</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent:   #00d4ff;
      --accent-2: #08f7a1;
      --gold:     #ffd700;
      --silver:   #c0c0c0;
      --bronze:   #cd7f32;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at top left,  rgba(0,212,255,.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(8,247,161,.12), transparent 25%),
        linear-gradient(135deg, #03101f 0%, #072654 55%, #04142d 100%);
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ── */
    header { position: relative; z-index: 2; padding: 32px 24px 16px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; max-width: 1400px; margin: auto;
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 58px; height: 58px; border-radius: 18px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; box-shadow: 0 10px 25px rgba(0,212,255,.35);
    }
    .logo h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
    .logo p  { opacity: .75; font-size: .95rem; margin-top: 4px; }

    nav {
      position: relative; z-index: 2;
      max-width: 1400px; margin: 24px auto 0;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    nav a {
      text-decoration: none; color: #fff;
      padding: 11px 16px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
      transition: .25s ease; font-weight: 600; font-size: .9rem;
      backdrop-filter: blur(10px);
    }
    nav a:hover, nav a.active {
      transform: translateY(-2px);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04142d;
    }

    /* ── PAGE ── */
    .page-wrapper {
      position: relative; z-index: 2;
      max-width: 1200px; margin: 36px auto 64px; padding: 0 24px;
    }
    .page-title { margin-bottom: 28px; }
    .page-title h2 { font-size: clamp(1.5rem,3vw,2.2rem); font-weight: 800; }
    .page-title p  { opacity: .7; font-size: .95rem; margin-top: 6px; }

    /* ── RESUMO ── */
    .resumo-grid {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 14px; margin-bottom: 32px;
    }
    .resumo-card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px; padding: 20px 16px; text-align: center;
      backdrop-filter: blur(16px);
    }
    .resumo-card .r-ico { font-size: 1.6rem; margin-bottom: 6px; }
    .resumo-card .r-val { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
    .resumo-card .r-lbl { font-size: .68rem; opacity: .6; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

    /* ── ABAS ── */
    .tabs-wrap {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .tab-btn {
      padding: 10px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #fff; font-family: 'Montserrat', sans-serif;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: .2s ease; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { background: rgba(255,255,255,.10); transform: translateY(-1px); }
    .tab-btn.ativo {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04142d; border-color: transparent;
      box-shadow: 0 6px 18px rgba(0,212,255,.3);
    }

    /* ── SECTION CARD ── */
    .section-card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 28px; backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,.30); overflow: hidden;
    }
    .section-header {
      display: flex; align-items: center; gap: 12px;
      padding: 22px 28px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .section-header .s-icon { font-size: 1.4rem; }
    .section-header h3 { font-size: 1.1rem; font-weight: 700; }
    .section-header .s-badge {
      margin-left: auto; font-size: .74rem; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(0,212,255,.15); border: 1px solid rgba(0,212,255,.3);
      color: var(--accent); letter-spacing: .5px; text-transform: uppercase;
    }

    /* ── PÓDIO ── */
    .podio-wrap {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 14px; padding: 24px 28px 10px; align-items: end;
    }
    .podio-card {
      border-radius: 18px; padding: 18px 14px;
      text-align: center; border: 1px solid rgba(255,255,255,.10);
      position: relative; transition: .2s ease;
    }
    .podio-card:hover { transform: translateY(-3px); }
    .podio-card.p1 {
      background: linear-gradient(160deg, rgba(255,215,0,.18), rgba(255,215,0,.04));
      border-color: rgba(255,215,0,.35); padding-top: 22px; padding-bottom: 22px;
    }
    .podio-card.p2 {
      background: linear-gradient(160deg, rgba(192,192,192,.14), rgba(192,192,192,.03));
      border-color: rgba(192,192,192,.3);
    }
    .podio-card.p3 {
      background: linear-gradient(160deg, rgba(205,127,50,.14), rgba(205,127,50,.03));
      border-color: rgba(205,127,50,.3);
    }
    .podio-medalha { font-size: 1.6rem; margin-bottom: 8px; }
    .podio-flag {
      width: 52px; height: 39px; border-radius: 6px; object-fit: cover;
      margin: 0 auto 10px; display: block;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .podio-flag-ph {
      width: 52px; height: 39px; border-radius: 6px; margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.07); font-size: 1.4rem;
    }
    .podio-nome { font-weight: 800; font-size: .92rem; margin-bottom: 6px; line-height: 1.3; }
    .podio-pct  { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .podio-card.p1 .podio-pct { color: var(--gold); }
    .podio-card.p2 .podio-pct { color: var(--silver); }
    .podio-card.p3 .podio-pct { color: var(--bronze); }
    .podio-votos { font-size: .7rem; opacity: .6; margin-top: 4px; }

    /* ── BARRAS ── */
    .barras-wrap { padding: 8px 28px 24px; }

    .barra-sep {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; opacity: .4; margin: 16px 0 6px;
      padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .barra-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0;
    }
    .barra-rank {
      width: 22px; font-size: .7rem; font-weight: 700;
      opacity: .4; text-align: center; flex-shrink: 0;
    }
    .barra-flag {
      width: 26px; height: 19px; border-radius: 3px;
      object-fit: cover; flex-shrink: 0;
    }
    .barra-flag-ph {
      width: 26px; height: 19px; border-radius: 3px; flex-shrink: 0;
      background: rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem;
    }
    .barra-nome {
      font-size: .8rem; font-weight: 600; flex-shrink: 0;
      width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .barra-track {
      flex: 1; height: 9px; border-radius: 99px;
      background: rgba(255,255,255,.06); overflow: hidden;
    }
    .barra-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .5s ease;
    }
    .barra-fill.zero { background: rgba(255,255,255,.08); }
    .barra-pct {
      font-size: .75rem; font-weight: 700; width: 42px;
      text-align: right; flex-shrink: 0; color: var(--accent);
    }
    .barra-pct.zero { color: rgba(255,255,255,.25); }
    .barra-votos {
      font-size: .68rem; opacity: .45; width: 58px;
      text-align: right; flex-shrink: 0;
    }

    /* ── FOOTER / BOTÃO TOPO ── */
    .botao-topo {
      position: fixed; bottom: 30px; right: 28px; z-index: 99;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04142d; font-weight: 700; font-size: .85rem;
      padding: 12px 18px; border-radius: 999px; text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,212,255,.35); transition: .25s ease;
    }
    .botao-topo:hover { transform: translateY(-3px); }
    footer {
      position: relative; z-index: 2; padding: 32px 24px 48px;
      text-align: center; opacity: .65; font-size: .92rem;
    }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      .logo h1 { font-size: 1.3rem; }
      .resumo-grid { grid-template-columns: repeat(2,1fr); }
      .podio-wrap { grid-template-columns: 1fr; padding: 18px 18px 8px; }
      .podio-card.p1, .podio-card.p2, .podio-card.p3 { padding: 14px; }
      /* Mantém a ordem correta do pódio no mobile: 1º, 2º e 3º */
      .podio-card.p1 { order: 1; }
      .podio-card.p2 { order: 2; }
      .podio-card.p3 { order: 3; }
      .barras-wrap { padding: 6px 16px 20px; }
      .barra-nome { width: 90px; font-size: .74rem; }
      .barra-votos { display: none; }
      .section-header { padding: 16px 18px 14px; }
    }

    /* ── DIVISOR DE GRUPO DE ABAS ── */
    .tabs-grupo-label {
      width: 100%;
      font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      opacity: .4; margin: 18px 0 2px;
    }
    .tabs-grupo-label:first-child { margin-top: 0; }

    /* ── LOADING / ERRO (seções dinâmicas) ── */
    .din-loading, .din-erro, .din-vazio {
      text-align: center; padding: 40px 24px;
      opacity: .55; font-size: .9rem;
    }
    .din-erro { color: #ff8a8a; opacity: .85; }
    .din-spinner {
      width: 30px; height: 30px; margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: dinSpin .8s linear infinite;
    }
    @keyframes dinSpin { to { transform: rotate(360deg); } }

    /* ── PLACARES EXATOS — lista de jogos ── */
    .cravadas-wrap { padding: 22px 28px 26px; display: flex; flex-direction: column; gap: 12px; }
    .cravada-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      transition: .2s ease;
    }
    .cravada-card:hover { border-color: rgba(0,212,255,.25); transform: translateY(-2px); }

    .cravada-jogo {
      display: flex; align-items: center; gap: 10px;
      flex: 1; min-width: 200px;
    }
    .cravada-time { display: flex; align-items: center; gap: 7px; }
    .cravada-time-nome {
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .8px;
      color: #fff;
      min-width: 38px;
      text-align: center;
    }
    .unico-time {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 55px;
    }
    .unico-time img {
      width: 38px !important;
      height: 28px !important;
      border-radius: 4px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .unico-time .cravada-time-nome {
      min-width: auto;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1;
    }

    .cravada-placar {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--gold);
      min-width: 70px;
      flex-shrink: 0;
      text-align: center;
      letter-spacing: 1px; 
      white-space: nowrap; 
      padding: 0 4px;
    }
  
    .cravada-info {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .cravada-count {
      display: flex; flex-direction: column; align-items: center;
      min-width: 64px;
    }
    .cravada-count-num { font-size: 1.3rem; font-weight: 800; color: var(--accent-2); line-height: 1; }
    .cravada-count-lbl { font-size: .62rem; opacity: .55; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    .cravada-solo {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; font-weight: 700;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(255,215,0,.12); border: 1px solid rgba(255,215,0,.3);
      color: var(--gold);
    }

    @media (max-width: 700px) {
      .cravadas-wrap { padding: 16px 16px 20px; }
      .cravada-card { padding: 14px 16px; gap: 10px; }
      .cravada-jogo { width: 100%; }
    }

    /* ── MENTES BRILHANTES — acerto exato solitário ── */
    .unicos-titulo {
      display: flex; align-items: center; gap: 10px;
      font-size: .82rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 14px;
      color: var(--gold);
    }
    .unicos-titulo-emoji {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 6px rgba(255,215,0,.6));
    }
    .unicos-titulo-badge {
      margin-left: auto;
      font-size: .68rem; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(255,215,0,.15); border: 1px solid rgba(255,215,0,.35);
      color: var(--gold); text-transform: none; letter-spacing: 0;
    }

    .unicos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 4px;
    }
    .unico-card {
      position: relative;
      background: linear-gradient(160deg, rgba(255,215,0,.14), rgba(255,215,0,.03));
      border: 1px solid rgba(255,215,0,.3);
      border-radius: 20px;
      padding: 20px 18px;
      text-align: center;
      overflow: hidden;
      transition: .2s ease;
    }
    .unico-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255,215,0,.18);
      border-color: rgba(255,215,0,.5);
    }
    .unico-card::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,215,0,.12), transparent 60%);
      pointer-events: none;
    }
    .unico-emoji {
      font-size: 1.8rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 8px rgba(255,215,0,.55));
      animation: brilho 2.4s ease-in-out infinite;
    }
    @keyframes brilho {
      0%, 100% { transform: scale(1); opacity: .9; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    .unico-jogo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 0 0 60px;
      
      flex-wrap: nowrap;
  
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .unico-nome {
      font-size: 1.05rem; font-weight: 800;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .unico-sub {
      font-size: .72rem; opacity: .6;
    }

    @media (max-width: 700px) {
      .unicos-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .unico-card { padding: 16px 12px; }
    }

    @media (max-width: 768px){
      .unico-jogo{
          flex-direction: column;
          gap: 10px;
      }
      .cravada-placar{
          min-width: auto;
          font-size: 2rem;
      }
      .unico-time{
          min-width: auto;
      }
      .unico-time img{
          width: 44px !important;
          height: 32px !important;
       }
       .cravada-time-nome{
           font-size: 1rem;
       }

    .placar-card{
        padding:20px 16px;
      }
    .placar-top{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:12px;
      }
      .placar-time{
        width:100%;
        justify-content:center;
        text-align:center;
        font-size: .95rem;
        font-weight: 800;
        letter-spacing: .5px;
      }
      .placar-time img{
        width:32px;
        height:24px;
      }
     .placar-score{
        font-size:2.2rem;
        min-width:auto;
      }
     }  
  </style>
</head>

const URL_EST_PALP = 'https://script.google.com/macros/s/AKfycbxiiDpGwGYiEauxy_1e8fH5ysQGi3IJijVZluOZQI_Ftndbyz6htgngfWQFkfeLwL3XWg/exec?aba=EstPalp';

// Cache dos dados brutos da aba EstPalp (busca uma vez, reaproveita entre abas)
let _estPalpCache = null;
let _estPalpPromise = null;

async function carregarEstPalp() {
  if (_estPalpCache) return _estPalpCache;
  if (_estPalpPromise) return _estPalpPromise;

  _estPalpPromise = (async () => {
    const res  = await fetch(URL_EST_PALP);
    const json = await res.json();
    if (!json.data || !Array.isArray(json.data)) throw new Error('Formato inesperado da aba EstPalp.');
    _estPalpCache = json.data;
    return _estPalpCache;
  })();

  return _estPalpPromise;
}

function pct(votos, total) {
  return total > 0 ? ((votos / total) * 100).toFixed(1) : '0.0';
}

function flagImgHtml(nome, w, h, r=4) {
  const url = flagUrl(nome);
  return url
    ? `<img src="${url}" style="width:${w}px;height:${h}px;border-radius:${r}px;object-fit:cover;" alt="${nome}">`
    : `<div style="width:${w}px;height:${h}px;border-radius:${r}px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:${Math.round(h*.5)}px;">?</div>`;
}

// Converte dados para lista ordenada por votos desc, excluindo zeros quando indicado
function listaOrdenada(fase, excluirZero=false) {
  let arr;
  if (fase.tipo === 'jogador') {
    arr = ARTILHEIROS.map(a => ({nome: a.s, votos: a.votos}));
  } else {
    arr = SELECOES.map(r => ({nome: r.s, votos: r[fase.campo]}));
  }
  arr.sort((a,b) => b.votos - a.votos);
  if (excluirZero) arr = arr.filter(x => x.votos > 0);
  return arr;
}

function renderTabs(faseAtiva) {
  const wrap = document.getElementById('tabs-wrap');

  let html = '';
  let grupoAnterior = null;

  FASES.forEach(f => {
    const grupo = f.grupo || 'palpites';
    if (grupo !== grupoAnterior) {
      const labelGrupo = grupo === 'desempenho' ? '📊 Desempenho dos Participantes' : '🗳️ Palpites de Classificação';
      html += `<div class="tabs-grupo-label">${labelGrupo}</div>`;
      grupoAnterior = grupo;
    }
    html += `
      <button class="tab-btn${f.id === faseAtiva.id ? ' ativo' : ''}" data-id="${f.id}">
        <span>${f.icon}</span><span>${f.label}</span>
      </button>`;
  });

  wrap.innerHTML = html;

  wrap.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const fase = FASES.find(f => f.id === btn.dataset.id);
      renderTabs(fase);
      renderFase(fase);
      // Scroll suave para o card
      document.getElementById('section-card')
        .scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// ═══════════════════════════════════════════════════════════════
//  RENDERIZA CONTEÚDO DE UMA FASE
// ═══════════════════════════════════════════════════════════════
function renderFase(fase) {
  document.getElementById('cat-icon').textContent   = fase.icon;
  document.getElementById('cat-titulo').textContent  = `${fase.label} — ${fase.desc}`;

  if (fase.tipo === 'cravadas') {
    renderCravadas(fase);
    return;
  }
  if (fase.tipo === 'desempenho') {
    renderDesempenho(fase);
    return;
  }

  const todos   = listaOrdenada(fase, false);
  const comVoto = todos.filter(x => x.votos > 0);
  const semVoto = todos.filter(x => x.votos === 0);
  const totalV  = todos.reduce((s,x) => s + x.votos, 0);

  document.getElementById('cat-badge').textContent =
    `${comVoto.length} seleções · ${totalV} votos`;

  // ── Pódio (top 3 com votos) ──
  const top3 = comVoto.slice(0, 3);
  const resto = comVoto.slice(3);
  const medalhas = ['🥇','🥈','🥉'];
  const ordemVisual = [1, 0, 2]; // 2º | 1º | 3º para efeito de pódio

  const podioHtml = top3.length
    ? ordemVisual.filter(i => top3[i]).map(i => {
        const item  = top3[i];
        const cls   = ['p1','p2','p3'][i];
        const perc  = pct(item.votos, totalV);
        const fImgH = fase.tipo === 'selecao'
          ? flagImgHtml(item.nome, 52, 39)
          : (FOTOS_ARTILHEIROS[item.nome]
             ? `<img class="podio-flag" src="${FOTOS_ARTILHEIROS[item.nome]}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;" alt="${item.nome}">`
             : `<div class="podio-flag-ph">⚽</div>`);
        return `
          <div class="podio-card ${cls}">
            <div class="podio-medalha">${medalhas[i]}</div>
            ${fImgH}
            <div class="podio-nome">${item.nome}</div>
            <div class="podio-pct">${perc}%</div>
            <div class="podio-votos">${item.votos} voto${item.votos!==1?'s':''}</div>
          </div>`;
      }).join('')
    : '<div style="opacity:.4;font-size:.9rem;text-align:center;padding:24px 0 8px;grid-column:1/-1;">Sem palpites registrados</div>';

  document.getElementById('podio-wrap').innerHTML = podioHtml;

  // ── Barras (posições 4 em diante com votos + zerados) ──
  const maxV = comVoto[0]?.votos || 1;

  function barraItem(item, rank) {
    const p     = pct(item.votos, totalV);
    const larg  = item.votos > 0 ? (item.votos / maxV * 100) : 0;
    const zero  = item.votos === 0;
    const fImgH = fase.tipo === 'selecao'
      ? (flagUrl(item.nome)
          ? `<img class="barra-flag" src="${flagUrl(item.nome)}" alt="${item.nome}">`
          : `<div class="barra-flag-ph">?</div>`)
      : (FOTOS_ARTILHEIROS[item.nome]
          ? `<img class="barra-flag" src="${FOTOS_ARTILHEIROS[item.nome]}" style="border-radius:50%;" alt="${item.nome}">`
          : `<div class="barra-flag-ph">⚽</div>`);
    return `
      <div class="barra-item">
        <span class="barra-rank">${zero ? '·' : rank}</span>
        ${fImgH}
        <span class="barra-nome" title="${item.nome}">${item.nome}</span>
        <div class="barra-track">
          <div class="barra-fill${zero?' zero':''}" style="width:${larg}%;"></div>
        </div>
        <span class="barra-pct${zero?' zero':''}">${zero ? '—' : p+'%'}</span>
        <span class="barra-votos">${zero ? '0 votos' : item.votos+' voto'+(item.votos!==1?'s':'')}</span>
      </div>`;
  }

  let barrasHtml = '';

  if (resto.length > 0) {
    barrasHtml += resto.map((item, i) => barraItem(item, i + 4)).join('');
  }

  if (semVoto.length > 0 && fase.id !== 'artilheiro') {
    barrasHtml += `<div class="barra-sep">Sem palpites nesta fase</div>`;
    barrasHtml += semVoto.map(item => barraItem(item, 0)).join('');
  }

  document.getElementById('barras-wrap').innerHTML = barrasHtml ||
    (top3.length >= todos.length
      ? `<div style="opacity:.4;text-align:center;padding:12px 0 4px;font-size:.85rem;">Todas as seleções exibidas no pódio acima</div>`
      : '');
}

// ═══════════════════════════════════════════════════════════════
//  RENDERIZA "PLACARES EXATOS" — lista de jogos com cravadas
// ═══════════════════════════════════════════════════════════════
async function renderCravadas(fase) {
  const podioWrap  = document.getElementById('podio-wrap');
  const barrasWrap = document.getElementById('barras-wrap');

  podioWrap.innerHTML = '';
  barrasWrap.innerHTML = `
    <div class="din-loading">
      <div class="din-spinner"></div>
      Carregando placares exatos…
    </div>`;
  document.getElementById('cat-badge').textContent = '—';

  let dados;
  try {
    dados = await carregarEstPalp();
  } catch (e) {
    barrasWrap.innerHTML = `<div class="din-erro">❌ Não foi possível carregar os dados.<br><small>${e.message}</small></div>`;
    return;
  }

  // Filtra apenas linhas que de fato têm um jogo associado a cravadas
  const jogos = dados
    .filter(r => String(r.Time1 || '').trim() && String(r.Time2 || '').trim())
    .map(r => ({
      time1:  String(r.Time1 || '').trim(),
      time2:  String(r.Time2 || '').trim(),
      gols1:  r.golsTime1 ?? '',
      gols2:  r.golsTime2 ?? '',
      num:    Number(r.NumCravadas) || 0,
      solo:   String(r.seSolo || '').trim(),
    }));

  document.getElementById('cat-badge').textContent = `${jogos.length} jogo${jogos.length !== 1 ? 's' : ''}`;

  if (!jogos.length) {
    barrasWrap.innerHTML = `<div class="din-vazio">Nenhuma cravada registrada ainda.</div>`;
    return;
  }

  // Ordena por número de cravadas (mais acertados primeiro)
  jogos.sort((a, b) => b.num - a.num);

  // Separa os jogos com apenas 1 acerto exato — viram destaque especial no topo
  const unicos = jogos.filter(j => j.num === 1 && j.solo);
  const demais = jogos.filter(j => !(j.num === 1 && j.solo));

  const unicosHtml = unicos.length ? `
    <div class="unicos-titulo">
      <span class="unicos-titulo-emoji">🧠</span>
      <span>Mentes Brilhantes — Acerto Solitário</span>
      <span class="unicos-titulo-badge">${unicos.length} jogo${unicos.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="unicos-grid">
      ${unicos.map(j => {
        const t1Img = flagImgHtml(j.time1, 26, 19, 4);
        const t2Img = flagImgHtml(j.time2, 26, 19, 4);
        return `
          <div class="unico-card">
            <div class="unico-emoji">🧠</div>
            <div class="unico-nome">${j.solo}</div>
            <div class="unico-sub">foi o único a cravar esse placar</div>
            <br>
            <div class="unico-jogo">
            
              <div class="unico-time">
                ${flagImgHtml(j.time1,38,28,4)}
                <span class="cravada-time-nome">${tri(j.time1)}</span>
              </div>
            
              <span class="cravada-placar">
                ${j.gols1} × ${j.gols2}
              </span>
            
              <div class="unico-time">
                ${flagImgHtml(j.time2,38,28,4)}
                <span class="cravada-time-nome">${tri(j.time2)}</span>
              </div>
            
            </div>
          </div>`;
      }).join('')}
    </div>
    <div class="barra-sep" style="margin-top:24px;">Demais placares exatos</div>
  ` : '';

  const cardsHtml = demais.map(j => {
    const t1Img = flagImgHtml(j.time1, 30, 22, 4);
    const t2Img = flagImgHtml(j.time2, 30, 22, 4);
    const soloHtml = j.solo
      ? `<span class="cravada-solo">🎯 Só ${j.solo} acertou!</span>`
      : '';
    
    // Se for mobile mostra o trigrama ao invés do nome completo da seleção
    const nomeTime1 =
        isMobile()
            ? tri(j.time1)
            : j.time1;
    
    const nomeTime2 =
        isMobile()
            ? tri(j.time2)
            : j.time2;
    return `
      <div class="cravada-card">
        <div class="cravada-jogo">
          <div class="cravada-time">${t1Img}<span class="cravada-time-nome">${nomeTime1}</span></div>
          <span class="cravada-placar">${j.gols1} × ${j.gols2}</span>
          <div class="cravada-time">${t2Img}<span class="cravada-time-nome">${nomeTime2}</span></div>
        </div>
        <div class="cravada-info">
          <div class="cravada-count">
            <span class="cravada-count-num">${j.num}</span>
            <span class="cravada-count-lbl">acerto${j.num !== 1 ? 's' : ''}</span>
          </div>
          ${soloHtml}
        </div>
      </div>`;
  }).join('');

  const demaisVazioHtml = (!demais.length && unicos.length)
    ? '' // todos os jogos já apareceram na seção de acerto único
    : cardsHtml;

  barrasWrap.innerHTML = `<div class="cravadas-wrap">${unicosHtml}${demaisVazioHtml}</div>`;
}

// ═══════════════════════════════════════════════════════════════
//  RENDERIZA "TOP 1 / TOP 3 / TOP 10" — pódio de participantes
// ═══════════════════════════════════════════════════════════════
async function renderDesempenho(fase) {
  const podioWrap  = document.getElementById('podio-wrap');
  const barrasWrap = document.getElementById('barras-wrap');

  podioWrap.innerHTML = '';
  barrasWrap.innerHTML = `
    <div class="din-loading">
      <div class="din-spinner"></div>
      Carregando desempenho dos participantes…
    </div>`;
  document.getElementById('cat-badge').textContent = '—';

  let dados;
  try {
    dados = await carregarEstPalp();
  } catch (e) {
    barrasWrap.innerHTML = `<div class="din-erro">❌ Não foi possível carregar os dados.<br><small>${e.message}</small></div>`;
    return;
  }


  // Extrai pares (participante, vezes) a partir das colunas configuradas na fase
  const lista = dados
    .map(r => ({
      nome:  String(r[fase.campoNome] || '').trim(),
      votos: Number(r[fase.campoVezes]) || 0,
    }))
    .filter(x => x.nome);

  lista.sort((a, b) => b.votos - a.votos);

  const totalV = lista.reduce((s, x) => s + x.votos, 0);
  document.getElementById('cat-badge').textContent =
    `${lista.length} participante${lista.length !== 1 ? 's' : ''}`;

  if (!lista.length) {
    barrasWrap.innerHTML = `<div class="din-vazio">Nenhum dado disponível para esta categoria.</div>`;
    return;
  }

  // ── Pódio (top 3) ──
  const top3  = lista.slice(0, 3);
  const resto = lista.slice(3);
  const medalhas = ['🥇','🥈','🥉'];
  const ordemVisual = [1, 0, 2];

  podioWrap.innerHTML = ordemVisual.filter(i => top3[i]).map(i => {
    const item = top3[i];
    const cls  = ['p1','p2','p3'][i];
    return `
      <div class="podio-card ${cls}">
        <div class="podio-medalha">${medalhas[i]}</div>
        <div class="podio-flag-ph" style="font-size:1.6rem;">👤</div>
        <div class="podio-nome">${item.nome}</div>
        <div class="podio-pct">${item.votos}×</div>
        <div class="podio-votos">&nbsp;</div>
      </div>`;
  }).join('');

  // ── Barras (restante) ──
  const maxV = lista[0]?.votos || 1;

  barrasWrap.innerHTML = resto.map((item, i) => {
    const larg = item.votos > 0 ? (item.votos / maxV * 100) : 0;
    return `
      <div class="barra-item">
        <span class="barra-rank">${i + 4}</span>
        <div class="barra-flag-ph">👤</div>
        <span class="barra-nome" title="${item.nome}">${item.nome}</span>
        <div class="barra-track">
          <div class="barra-fill" style="width:${larg}%;"></div>
        </div>
        <span class="barra-pct">${item.votos}×</span>
        <span class="barra-votos"></span>
      </div>`;
  }).join('') || `<div style="opacity:.4;text-align:center;padding:12px 0 4px;font-size:.85rem;">Todos os participantes exibidos no pódio acima</div>`;
}

// ═══════════════════════════════════════════════════════════════
//  BOOTSTRAP
// ═══════════════════════════════════════════════════════════════
function init() {
  renderResumo();
  renderTabs(FASES[0]);
  renderFase(FASES[0]);
  // Dispara o carregamento da aba EstPalp em segundo plano,
  // assim quando o usuário clicar em Top1/Top3/Top10/Cravadas o cache já está pronto
  carregarEstPalp().catch(() => {});
}

init();
</script>
